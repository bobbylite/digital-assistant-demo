name: Secret scan

# Runs the open-source Gitleaks CLI directly via its official Docker image,
# rather than the gitleaks-action wrapper — that wrapper requires a paid
# license for org-owned repos and is scheduled to stop working entirely once
# GitHub drops Node 20 runners (Sept 2026). The underlying scanner is MIT
# licensed and free regardless of account type; this avoids depending on the
# wrapper's licensing or its Node runtime lifecycle.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not just the current commit — a secret introduced
          # and later removed is still a leaked secret.
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --verbose --redact
