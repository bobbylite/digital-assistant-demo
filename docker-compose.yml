services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    # Optional and gitignored, same file `npm run dev` reads — see
    # .env.local.example. Marked not required so the container still starts
    # (in manual JWT-paste mode) if you haven't created one yet.
    env_file:
      - path: .env.local
        required: false
    # Uncomment to let the in-app Settings panel's writes survive
    # `docker compose down` — without this, saving a setting still takes
    # effect immediately (applied to the running container's process.env),
    # it just won't outlive the container. Requires .env.local to already
    # exist on the host *before* you uncomment this and start the container
    # — bind-mounting a path that doesn't exist yet makes Docker silently
    # create a directory there instead of a file, which is worse than not
    # mounting it at all. `cp .env.local.example .env.local` first if you
    # haven't already, then uncomment:
    # volumes:
    #   - ./.env.local:/app/.env.local
    restart: unless-stopped
